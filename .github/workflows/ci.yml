name: CI

# Full quality gate for the current backend.
#
# Run this gate on every push and pull request, while keeping manual dispatch
# available. The same checks are available locally for fast feedback:
#   npm run typecheck && npm run lint && npm test && npm run boundaries && npm run check:documentation && npm run check:capabilities

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, architecture, documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Documentation and generated maps
        run: npm run check:documentation

      - name: Documentation unit tests
        run: npm run test:documentation

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci --runInBand

      - name: Application boot smoke
        run: npm test -- --ci --runInBand tests/architecture/app-module.boot.spec.ts

      - name: Module boundaries
        run: npm run boundaries

      - name: Application boundaries
        run: npm run check:application-boundaries

      - name: Architecture metrics
        run: npm run report:architecture-metrics -- --json

      - name: Provider encapsulation diagnostic
        run: npm run check:provider-encapsulation

      - name: Schema ownership
        run: npm run check:schema-ownership

      - name: Capability registry
        run: npm run check:capabilities

      - name: Capability package provenance
        run: npm run check:capability-package

      - name: Composition source
        run: npm run check:composition-source

      - name: Capability ledger
        run: npm run check:capability-ledger

      - name: Compiled build-profile conformance
        run: npm run check:composition-profiles

      - name: Migration replay order
        run: npm run db:apply:all -- --dry-run

      - name: Live Postgres integration (when configured)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
        run: npm test -- --ci --runInBand tests/integration/database.integration.spec.ts

  e2e:
    name: End-to-end suite (Postgres fixture)
    # A push to a branch with an open pull request already runs through the
    # pull_request event, so pushes run this job only on main.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # project-creation-environments reads the central workflow templates from
      # this path. The default (../alphaci-workflow) resolves outside the
      # checkout, so point it at the sibling checkout below.
      TEMPLATE_REPO_PATH: ${{ github.workspace }}/alphaci-workflow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Public repository. It must sit inside the workspace: actions/checkout
      # refuses paths outside it. Pinned to the commit the suite was last run
      # against. To bump it, run the suite against the new commit, then change
      # `ref` here in the same pull request.
      - uses: actions/checkout@v4
        with:
          repository: Alpha-Explora/alphaci-workflow
          ref: 0e584eb948951c855fe46a3493a2b395b8a5d208
          path: alphaci-workflow
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # global-setup starts the disposable Postgres fixture with docker compose.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: artifacts/e2e/
          if-no-files-found: ignore

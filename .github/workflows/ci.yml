name: CI

# One workflow, two parallel jobs. Locally, `npm run verify` runs the same
# checks; `npm run check` runs only the static gates.

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Static gates (docs, boundaries, schema, capabilities, migrations)
        run: npm run check

      - name: Compiled build-profile conformance
        run: npm run check:composition-profiles

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Jest suite
        run: npm test -- --ci --runInBand

      # Reads the hosted schema and inserts rows inside rolled-back
      # transactions. Replacing it with a disposable PostgreSQL service is
      # tracked in docs/superpowers/plans/2026-09-25-e2e-harness-and-test-pruning.md.
      - name: Live Postgres integration (when configured)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
        run: npm test -- --ci --runInBand tests/integration/database.integration.spec.ts

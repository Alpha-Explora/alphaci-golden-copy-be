name: CI

# One workflow, two parallel jobs. Locally, `npm run verify` runs the same
# checks; `npm run check` runs only the static gates.

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Static gates (docs, boundaries, schema, capabilities, migrations)
        run: npm run check

      - name: Compiled build-profile conformance
        run: npm run check:composition-profiles

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Jest suite
        run: npm test -- --ci --runInBand

# Render Blueprint for the one platform.outbox_events consumer.
#
# The web service and this cron job must use the same database credentials.
# Leave secret values as `sync: false` and attach the same Render environment
# values used by the web service; no credential is stored in the repository.
# Do not add a second outbox consumer: leases prevent concurrent row ownership,
# while this single scheduled owner is the deployment-level ownership boundary.
services:
  - type: cron
    name: alphaci-outbox-relay
    runtime: docker
    schedule: "*/1 * * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/process-outbox.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: OUTBOX_MAX_ATTEMPTS
        value: "5"
      - key: OUTBOX_RETRY_DELAY_SECONDS
        value: "60"
      - key: OUTBOX_LEASE_SECONDS
        value: "300"
      - key: OUTBOX_HANDLER_TIMEOUT_MS
        value: "120000"
      - key: HIERARCHY_ENABLED
        value: "true"
      # Set this explicitly to `live` or `stub` for the deployment. The relay
      # refuses to start when the mode is missing so it cannot acknowledge
      # hierarchy events through an accidental no-op provider.
      - key: HIERARCHY_GITHUB_SYNC_MODE
        sync: false
      - key: HIERARCHY_MAX_SYNC_RETRIES
        value: "5"
      - key: HIERARCHY_SYNC_POLL_INTERVAL_MS
        value: "5000"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_CERT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
